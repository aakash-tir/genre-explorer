name: Refresh dataset

# Rolling refresh: a slice of the map every day, landing the same day.
#
# WHY DAILY SLICES. The old design rebuilt all 912 genres in one weekly job and never
# once succeeded. A cold build is ~14,010 MusicBrainz requests, and at the 1 req/s this
# project is bound to that is 4.3 h of pure waiting before Deezer's over-quota backoffs
# are counted. The 2026-08-16 run reached 325/913 genres in 5 h 50 m and was cancelled at
# the job ceiling — which also killed the actions/cache post-step, so it saved nothing
# and the following week started cold again. The workflow's own comment had claimed the
# cache "is saved even when the job fails or times out"; that is not true of a cancelled
# job, and it made the loop unbreakable. `gh cache list` showed no build-dataset entry at
# all, which is why public/data had never been refreshed automatically.
#
# So the unit of work is a DAY, not a dataset:
#
#   * details (this workflow's daily run) — the 66 least-recently-refreshed genres,
#     picked by `refreshedAt` in each detail file. ~5 min steady state. 912/66 = 14 days
#     to turn the whole map over, so nothing is ever more than a fortnight stale.
#   * graph (Sundays) — stages 1-3, which decide WHICH genres exist and how big nodes
#     are. Not shardable: split across days, the map would gain and lose nodes
#     mid-rotation. ~4,368 requests, ~80 min, comfortably inside one job.
#
# Every run leaves public/data complete and valid, so the live site is never waiting on a
# half-finished rotation — only the AGE of a given genre varies, never whether it exists.
on:
  schedule:
    # Daily 04:00 UTC — MusicBrainz is quietest then.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to rebuild'
        type: choice
        options: [details, graph, both]
        default: details
      shard_size:
        description: 'Genres to refresh (details mode); blank uses SHARD_SIZE'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

# Never let two refreshes write public/data at once; queue instead of cancelling, so a
# long Sunday graph run is not killed by Monday's details run.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: rolling refresh
    runs-on: ubuntu-latest
    # A runaway guard, not a budget — the per-STEP ceilings below are the budget, and
    # that distinction is load-bearing rather than stylistic. A JOB timeout CANCELS the
    # job, and a cancelled job skips its post-steps, including the `actions/cache` save.
    # A STEP timeout merely fails the step, so the later steps and the cache save still
    # run. At 120 this ceiling was doing the opposite of its job: it was the thing
    # killing every Sunday, and killing it in the one way that saves nothing.
    #
    # 350 sits just under the 360-minute hard limit GitHub imposes on hosted runners,
    # and above the 240 + 90 the two build steps can spend between them plus setup.
    timeout-minutes: 350

    # The `secrets` context is NOT available in a step-level `if:`, so the presence of
    # the token has to be surfaced as an env value here to be testable below.
    env:
      HAS_REFRESH_PAT: ${{ secrets.REFRESH_PAT != '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Upstream responses. Still worth carrying between runs — artist streaming links
      # and Deezer track ids change essentially never — but it is now an optimisation
      # again rather than the resume mechanism. Losing it costs one slow day, not the
      # whole rotation.
      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: .cache/build-dataset
          key: build-dataset-${{ github.run_id }}
          restore-keys: build-dataset-

      # Sunday also rebuilds the map. It decides which genres exist, so it runs as one
      # unit and BEFORE the day's details — a genre added today should get its detail
      # file today, not in a fortnight.
      - name: Decide today's work
        id: plan
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # Scheduled: rebuild the graph on Sundays, details every day.
            if [ "$(date -u +%u)" = "7" ]; then MODE=both; else MODE=details; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Today's mode: $MODE"

      # A refresh that reuses last week's scrape refreshes nothing. Drop the volatile
      # entries so this run genuinely re-reads upstream; keep the stable id mappings
      # (artist links, Deezer ids) that make a shard cheap. Only on real refreshes — a
      # manual dispatch to repair something must be able to reuse what is there.
      - name: Prune volatile cache
        if: github.event_name == 'schedule'
        run: |
          rm -rf .cache/build-dataset/artist-search \
                 .cache/build-dataset/recording-search \
                 .cache/build-dataset/lb-artists \
                 .cache/build-dataset/lb-recordings
          if [ "${{ steps.plan.outputs.mode }}" != "details" ]; then
            rm -rf .cache/build-dataset/genre-list \
                   .cache/build-dataset/genre-pages \
                   .cache/build-dataset/rg-counts
          fi

      # Sunday's graph rebuild is the expensive one: stages 1-3 are ~4,400 MusicBrainz
      # requests that cannot be sharded, because they decide WHICH genres exist and a
      # sliced run would make the map gain and lose nodes mid-rotation.
      #
      # It needs ~140 minutes and used to share a 120-minute job ceiling with the daily
      # details shard, so it could never finish: all 7 Sunday runs between 2026-08-09
      # and 2026-09-20 failed, `graph.json` had not been rebuilt since 2026-08-18, and
      # each cancellation skipped the cache save so the next Sunday started identical.
      # Measured on 2026-09-20: stage 2 took 69 min for 2,202 pages, stage 3 was ~50 min
      # in and unfinished when the ceiling killed it.
      #
      # 240 is roughly 1.7x the measured need, and `continue-on-error` matters for the
      # same reason it does below: a dead graph step must not skip the day's DETAILS
      # shard, which is how Sunday was costing the rotation a seventh of its days on
      # top of never rebuilding the map.
      - name: Rebuild graph
        id: graph
        if: steps.plan.outputs.mode != 'details'
        continue-on-error: true
        timeout-minutes: 240
        run: npm run build:dataset -- --graph

      # `continue-on-error` because the genres this step has ALREADY written are correct
      # and already on disk, and throwing them away is what cost the rotation 12 of its
      # first 34 days. Two different deaths are being survived here:
      #
      #   - the step exits non-zero (too much of the shard failed — see
      #     `shard-outcome.ts`, which already tolerates the flaky-genre case in-process)
      #   - the step is KILLED by `timeout-minutes` and never returns at all, which no
      #     amount of in-process error handling can catch
      #
      # Either way the run continues, commits what landed, and is then marked failed by
      # the last step so a bad day is still red in the Actions list. The step ceiling is
      # deliberately below the job ceiling so the kill leaves room for the steps below.
      - name: Rebuild today's genres
        id: details
        if: steps.plan.outputs.mode != 'graph'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          if [ -n "${{ github.event.inputs.shard_size }}" ]; then
            npm run build:dataset -- --shard=${{ github.event.inputs.shard_size }}
          else
            npm run build:dataset -- --shard
          fi

      # Stage 9 is the last thing `buildDetails` does, so a killed step never reaches
      # it and would leave the artist index describing genres that have since changed.
      # It is a pure re-read of `public/data/genres/` with no network, so running it
      # again here costs seconds and always leaves index and panels agreeing.
      - name: Reconcile the artist index
        if: steps.plan.outputs.mode != 'graph'
        run: npm run build:artist-index

      # The dataset passes the same schema and consistency tests as a code change.
      # This is the real gate: a partial shard still has to be internally consistent
      # and schema-valid before any of it reaches a PR.
      - name: Validate
        run: npm test

      # A PR opened with the default GITHUB_TOKEN does NOT trigger other workflows —
      # GitHub suppresses that to prevent recursion. `verify` is a REQUIRED check on
      # main, so such a PR would never get one, would never be mergeable, and the
      # rotation would stall on day one. A PAT (or App token) in REFRESH_PAT makes the
      # PR author an identity whose events do start workflows. Fail loudly rather than
      # opening un-mergeable PRs every morning.
      - name: Require a token that can trigger checks
        if: env.HAS_REFRESH_PAT != 'true'
        run: |
          echo "::error::REFRESH_PAT is not set. A pull request opened with GITHUB_TOKEN"
          echo "::error::cannot trigger the required 'verify' check, so it could never"
          echo "::error::auto-merge and the rotation would stall. Create a fine-grained"
          echo "::error::PAT with Contents:write + Pull requests:write on this repo and"
          echo "::error::save it as the REFRESH_PAT secret."
          exit 1

      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REFRESH_PAT }}
          branch: data/rolling-refresh
          title: 'data: rolling refresh'
          commit-message: 'data: rolling refresh'
          body: |
            Automated slice of the rolling refresh — the least-recently-refreshed genres,
            rebuilt from MusicBrainz, ListenBrainz and Deezer.

            The pipeline fails outright on a sharp drop in node or edge count, and the
            schema and consistency tests run above, so a green check means the shape is
            within tolerance. Tolerance is not the same as correct — spot-check if a
            genre you know well is in the diff.
          labels: data, automated
          delete-branch: true

      # Auto-merge rather than waiting for a human. A day that waits for review is a day
      # the rotation stalls, which is the staleness this design exists to remove. The
      # sharp-drop guard and the test suite are the gate; a bad slice can only affect the
      # ~66 genres it touched, and the next day's run is not blocked by it.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT }}

      # Land the data, THEN complain. The genres that succeeded are already in the PR
      # above and will merge on their own; this exists so a day that failed or ran out
      # of time is still visibly red rather than passing as a normal morning. The
      # genres it could not build kept their old `refreshedAt`, so they are at the head
      # of tomorrow's queue with no bookkeeping — see `rotation.ts`.
      - name: Report a failed or truncated shard
        if: steps.details.outcome == 'failure' || steps.graph.outcome == 'failure'
        run: |
          if [ "${{ steps.graph.outcome }}" = "failure" ]; then
            echo "::error::The graph rebuild failed or hit its 240-minute ceiling, so"
            echo "::error::public/data/graph.json may be unchanged: no genre entered or"
            echo "::error::left the map this week. Unlike the details shard this does NOT"
            echo "::error::self-heal — stages 1-3 only run on Sundays, so the next attempt"
            echo "::error::is a week away unless dispatched by hand with mode=graph."
          fi
          if [ "${{ steps.details.outcome }}" = "failure" ]; then
            echo "::error::Today's shard did not finish: the build step failed or hit its"
            echo "::error::90-minute ceiling. Whatever genres DID build have been committed"
            echo "::error::and the rest stay at the head of tomorrow's queue. Check the"
            echo "::error::'Rebuild today's genres' log above for which genres threw."
          fi
          exit 1
