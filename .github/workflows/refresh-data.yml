name: Refresh dataset

# Rebuilds public/data/ from MusicBrainz, ListenBrainz and Deezer, and opens a PR with
# the result. Never pushes to main — the dataset goes through the same review gate as
# code, which is the whole point of the sharp-drop guard in the pipeline.
#
# TIMING (measured, milestone 4/6 runs): a fully cold build is ~9 hours — over the
# 6-hour job limit. Two things make the weekly run fit anyway:
#
#   1. The pipeline's disk cache IS its resume mechanism. It is saved to the Actions
#      cache even when the job fails or times out, so a rerun continues where the
#      last one stopped. The very first run (or a run after the cache is evicted)
#      may need one or two manual re-dispatches to fill the cache; after that the
#      weekly run fits comfortably.
#   2. "Prune volatile cache" below deletes the parts that must be re-fetched for a
#      refresh to mean anything (the tree, the counts, the candidate searches, the
#      rankings) but keeps the stable id mappings (artist streaming links, Deezer
#      track ids — ~10k entries that change essentially never). A steady-state
#      weekly run is ~6,000 fresh requests ≈ 2.5-3 h.
on:
  schedule:
    # Sundays 04:00 UTC — MusicBrainz is quietest then.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild and open PR
    runs-on: ubuntu-latest
    # Just under the 6-hour hard limit so the cache post-step always gets to run.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Restore last run's upstream responses. The per-run key + prefix restore-keys
      # pattern means every run saves its own snapshot and the next run starts from
      # the newest one — including snapshots from failed/timed-out runs (resume).
      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: .cache/build-dataset
          key: build-dataset-${{ github.run_id }}
          restore-keys: build-dataset-

      # A refresh that reuses last week's scrape refreshes nothing. Drop everything
      # that must be current; keep the stable id mappings (links, Deezer ids) that
      # make the run fit in the job limit. Scheduled runs only — a manual dispatch
      # after a timeout must RESUME, not start the volatile fetches over.
      - name: Prune volatile cache (scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          rm -rf .cache/build-dataset/genre-list \
                 .cache/build-dataset/genre-pages \
                 .cache/build-dataset/rg-counts \
                 .cache/build-dataset/artist-search \
                 .cache/build-dataset/recording-search \
                 .cache/build-dataset/lb-artists \
                 .cache/build-dataset/lb-recordings

      - name: Rebuild dataset
        run: npm run build:dataset

      # The dataset must pass the same schema and consistency tests as a code change.
      - name: Validate
        run: npm test

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/weekly-refresh
          title: 'data: weekly dataset refresh'
          commit-message: 'data: weekly dataset refresh'
          body: |
            Automated rebuild of `public/data/` from MusicBrainz, ListenBrainz and Deezer.

            Check before merging:
            - [ ] Node and edge counts look sane against the previous dataset
            - [ ] No genre family has vanished
            - [ ] `graph.json` is still within the ~400 KB budget

            The pipeline fails outright on a sharp drop, so a green run means the counts
            are within tolerance — but tolerance is not the same as correct.
          labels: data, automated
          delete-branch: true
