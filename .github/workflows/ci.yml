# CI: lint, format, types, tests, build (the `verify` job).
#
# Kept lean on Actions minutes: pull requests only (the merge to main re-runs nothing,
# the PR already tested it), and only when a file this check depends on changed.
# Docs-only changes (docs/, logs/, graphify-out/, *.md) run no CI at all. Run it by
# hand from the Actions tab (workflow_dispatch) when needed.
#
# `verify` is a REQUIRED status check on main, so a PR that runs no CI cannot merge
# until it has one: for a docs-only PR, dispatch it on the branch
# (`gh workflow run ci.yml --ref <branch>`) — see docs/runbooks/ci-and-branch-protection.md.
# The daily dataset PR touches public/data/**, which is listed below, so it always runs.
name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # The gate. Everything above catches sloppiness; this catches wrongness.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The dataset is a committed artifact refreshed by an automated PR. Bundling it
      # proves the shipped payload is the one the tests validated, and makes the
      # graph.json size budget visible in the run summary.
      - name: Report bundle and dataset size
        run: |
          echo "### Payload" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          ls -lh public/data/graph.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
